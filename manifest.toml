#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "oxicloud"
name = "OxiCloud"
description.en = "Secure & lightweight self-hosted cloud storage"
description.fr = "Service de stockage cloud auto-hébergé, sécurisé et léger"

version = "0.10.0~ynh1"

maintainers = [""]

[upstream]
license = "MIT"
website = "https://atalayalabs.github.io/OxiCloud/"
code = "https://github.com/AtalayaLabs/OxiCloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/oxicloud"

    [install.admin]
    type = "user"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["ar", "de", "en", "es", "fa", "fr", "hi", "it", "ja", "ko", "nl", "pl", "pt", "ru", "zh", "zh-TW"]
    default = "fr"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/AtalayaLabs/OxiCloud/releases/download/v0.10.0/oxicloud-0.10.0-x86_64-unknown-linux-musl.tar.gz"
    sha256 = "4decd0cc6c07e370a7b57ac4d17432468380255e567889e0f243e042fd4441f9"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    api.url = "/api"
    api.auth_header = false
    api.show_tile = false
    api.protected= true
    api.allowed = ["visitors", "all_users"]

    [resources.ports]

    [resources.apt]
    packages = "postgresql, ffmpeg"

    [resources.database]
    type = "postgresql"
