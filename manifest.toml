#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "oxicloud"
name = "OxiCloud"
description.en = "Explain in *a few (10~15) words* the purpose of the app or what it actually does (it is meant to give a rough idea to users browsing a catalog of 100+ apps)"
description.fr = "Expliquez en *quelques* (10~15) mots l'utilité de l'app ou ce qu'elle fait (l'objectif est de donner une idée grossière pour des utilisateurs qui naviguent dans un catalogue de 100+ apps)"

version = "0.10.0~ynh1"

maintainers = [""]

[upstream]
license = "free"
website = "https://atalayalabs.github.io/OxiCloud/"
demo = "https://demo.example.com"
admindoc = "https://doc.yunohost.org/dev/packaging/"
userdoc = "https://yunohost.org/apps"
code = "https://github.com/AtalayaLabs/OxiCloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/oxicloud"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/AtalayaLabs/OxiCloud/releases/download/v0.10.0/oxicloud-0.10.0-x86_64-unknown-linux-musl.tar.gz"
    sha256 = "4decd0cc6c07e370a7b57ac4d17432468380255e567889e0f243e042fd4441f9"

    # autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql, ffmpeg"

    [resources.database]
    type = "postgresql"
